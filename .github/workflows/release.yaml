name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Release coordinates
        id: coordinates
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || exit 1
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: rustup toolchain install 1.94.1 --profile minimal --component rustfmt && rustup default 1.94.1
      - run: cargo fmt --check && cargo test --locked && cargo build --locked
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.14
      - working-directory: client
        run: bun install --frozen-lockfile && bun run check && bun run test
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - name: Package chart and client
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.coordinates.outputs.version }}
          IMAGE_REPOSITORY: ${{ steps.coordinates.outputs.image }}
        run: ./scripts/release.ps1 -Version $env:RELEASE_VERSION -ImageRepository $env:IMAGE_REPOSITORY -SkipImageBuild
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.coordinates.outputs.image }}:${{ steps.coordinates.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.coordinates.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.coordinates.outputs.version }}
          IMAGE: ${{ steps.coordinates.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf '%s@%s\n' "$IMAGE" "$DIGEST" > "dist/$VERSION/image.txt"
          (cd "dist/$VERSION" && sha256sum image.txt >> SHA256SUMS)
          printf 'Evaluation release. Single broker; no HA or TLS/authentication.\n\nImage: `%s@%s`\n' "$IMAGE" "$DIGEST" > "dist/$VERSION/notes.md"
          flags=()
          if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "AnvilMQ $VERSION" --notes-file "dist/$VERSION/notes.md" "${flags[@]}" \
            "dist/$VERSION/anvilmq-$VERSION.tgz" "dist/$VERSION/anvilmq-client-$VERSION.tgz" \
            "dist/$VERSION/queue.proto" "dist/$VERSION/aks-evaluation.yaml" \
            "dist/$VERSION/release.json" "dist/$VERSION/image.txt" "dist/$VERSION/SHA256SUMS"
