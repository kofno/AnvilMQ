syntax = "proto3";
package queue.v1;

service QueueService {
  rpc AddJob (AddJobRequest) returns (AddJobResponse);
  rpc GetNextJob (GetNextJobRequest) returns (GetNextJobResponse);
  rpc CompleteJob (CompleteJobRequest) returns (CompleteJobResponse);
  rpc FailJob (FailJobRequest) returns (FailJobResponse);
  rpc UpsertRateLimitRule (UpsertRateLimitRuleRequest) returns (UpsertRateLimitRuleResponse);
  rpc DeleteRateLimitRule (DeleteRateLimitRuleRequest) returns (DeleteRateLimitRuleResponse);
  rpc GetRateLimitStatus (GetRateLimitStatusRequest) returns (GetRateLimitStatusResponse);
  rpc Heartbeat (HeartbeatRequest) returns (HeartbeatResponse);
}

message JobMetadata {
  string parent_id = 1;
  string trace_id = 2;
  uint32 execution_depth = 3;
}

message AddJobRequest {
  string name = 1;
  bytes payload = 2;
  int32 priority = 3;
  JobMetadata metadata = 4;
  uint32 max_attempts = 5;
  int64 delay_ms = 6;
  string rate_limit_facet = 7;
  int64 retry_backoff_ms = 8;
  // Zero selects a 60-second cap (or the base delay, if larger).
  int64 retry_backoff_max_ms = 9;
}

message AddJobResponse {
  string id = 1;
  string state = 2;
}

message GetNextJobRequest {
  string worker_id = 1;
  repeated string queue_names = 2;
}

message GetNextJobResponse {
  bool found = 1;
  string id = 2;
  string name = 3;
  bytes payload = 4;
  JobMetadata metadata = 5;
  uint32 attempts = 6;
  int64 lease_expires_at_ms = 7;
}

message HeartbeatRequest {
  string id = 1;
  string worker_id = 2;
  uint32 attempt = 3;
}

message HeartbeatResponse {
  int64 lease_expires_at_ms = 1;
}

message CompleteJobRequest {
  string id = 1;
  string worker_id = 2;
  // Use attempts returned by GetNextJob. Zero is accepted only for attempt one.
  uint32 attempt = 3;
}

message CompleteJobResponse {
  bool success = 1;
}

message FailJobRequest {
  string id = 1;
  string worker_id = 2;
  string error_message = 3;
  uint32 attempt = 4;
}

message FailJobResponse {
  bool success = 1;
  bool moved_to_failed_state = 2;
}

message UpsertRateLimitRuleRequest {
  string facet_pattern = 1; // Exact key only; wildcards are rejected.
  uint32 max_jobs = 2; // Zero pauses this facet.
  int64 window_duration_ms = 3;
}
message UpsertRateLimitRuleResponse { bool success = 1; }
message DeleteRateLimitRuleRequest { string facet_key = 1; }
message DeleteRateLimitRuleResponse { bool deleted = 1; }
message GetRateLimitStatusRequest { string facet_key = 1; }
message GetRateLimitStatusResponse {
  string facet_key = 1;
  uint32 current_count = 2;
  uint32 max_jobs = 3;
  int64 window_expires_at = 4;
  bool is_throttled = 5;
  bool rule_exists = 6;
  int64 window_duration_ms = 7;
}
