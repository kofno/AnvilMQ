apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
  - name: AnvilMQ Failures
    uid: anvilmq-failures-infinity
    type: yesoreyeram-infinity-datasource
    access: proxy
    url: http://broker:9090
    isDefault: false
    editable: true
    jsonData:
      global_queries: []
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: true
    jsonData:
      maxLines: 2000
