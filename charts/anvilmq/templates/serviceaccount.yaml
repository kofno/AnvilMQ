{{- if .Values.backup.upload.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "anvilmq.name" . }}
  labels:
    {{- include "anvilmq.labels" . | nindent 4 }}
  annotations:
    # Azure Workload Identity binds this ServiceAccount to the user-assigned
    # managed identity whose client-id is supplied here. The federated credential
    # (created out of band) must map the AKS OIDC issuer + this ServiceAccount.
    azure.workload.identity/client-id: {{ .Values.backup.upload.workloadIdentity.clientId | quote }}
# The projected workload-identity token is mounted by the webhook, not the
# default API token, so this stays false to match the pod spec.
automountServiceAccountToken: false
{{- end }}
