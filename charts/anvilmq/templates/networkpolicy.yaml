{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "anvilmq.name" . }}
spec:
  podSelector:
    matchLabels:
      {{- include "anvilmq.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.allowedFrom | nindent 8 }}
      ports:
        - protocol: TCP
          port: 50051
        - protocol: TCP
          port: 9090
{{- end }}
