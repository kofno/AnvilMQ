apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "anvilmq.name" . }}
  labels:
    {{- include "anvilmq.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  serviceName: {{ include "anvilmq.name" . }}-headless
  selector:
    matchLabels:
      {{- include "anvilmq.selectorLabels" . | nindent 6 }}
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        {{- include "anvilmq.selectorLabels" . | nindent 8 }}
        {{- if .Values.backup.upload.enabled }}
        azure.workload.identity/use: "true"
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- if .Values.backup.upload.enabled }}
      serviceAccountName: {{ include "anvilmq.name" . }}
      {{- end }}
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: broker
          {{- if .Values.image.digest }}
          image: {{ printf "%s@%s" .Values.image.repository .Values.image.digest | quote }}
          {{- else }}
          image: {{ printf "%s:%s" .Values.image.repository (.Values.image.tag | default .Chart.AppVersion) | quote }}
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: ANVILMQ_ADDR
              value: "0.0.0.0:50051"
            - name: ANVILMQ_HTTP_ADDR
              value: "0.0.0.0:9090"
            - name: ANVILMQ_DB_PATH
              value: /data/anvil.db
            - name: ANVILMQ_DURABILITY
              value: {{ .Values.durability | quote }}
            - name: RUST_LOG
              value: {{ .Values.logLevel | quote }}
            - name: ANVILMQ_METRICS_QUEUES
              value: {{ join "," .Values.metricsQueues | quote }}
            {{- if .Values.engine.maxExecutionDepth }}
            - name: ANVILMQ_MAX_EXECUTION_DEPTH
              value: {{ .Values.engine.maxExecutionDepth | quote }}
            {{- end }}
            {{- if .Values.engine.maxChainSize }}
            - name: ANVILMQ_MAX_CHAIN_SIZE
              value: {{ .Values.engine.maxChainSize | quote }}
            {{- end }}
            {{- if .Values.engine.leaseDurationMs }}
            - name: ANVILMQ_LEASE_DURATION_MS
              value: {{ .Values.engine.leaseDurationMs | quote }}
            {{- end }}
            {{- if .Values.engine.recoveryIntervalMs }}
            - name: ANVILMQ_RECOVERY_INTERVAL_MS
              value: {{ .Values.engine.recoveryIntervalMs | quote }}
            {{- end }}
            {{- if .Values.engine.recoveryBatchSize }}
            - name: ANVILMQ_RECOVERY_BATCH_SIZE
              value: {{ .Values.engine.recoveryBatchSize | quote }}
            {{- end }}
            {{- if .Values.engine.fairnessEnabled }}
            - name: ANVILMQ_FAIRNESS_ENABLED
              value: "true"
            {{- end }}
            {{- if .Values.backup.enabled }}
            - name: ANVILMQ_BACKUP_ENABLED
              value: "true"
            - name: ANVILMQ_BACKUP_DIR
              value: /data/backups
            - name: ANVILMQ_BACKUP_INTERVAL_MS
              value: {{ .Values.backup.intervalMs | quote }}
            - name: ANVILMQ_BACKUP_RETAIN
              value: {{ .Values.backup.retain | quote }}
            {{- end }}
          ports:
            - name: grpc
              containerPort: 50051
            - name: http
              containerPort: 9090
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
        {{- if .Values.backup.upload.enabled }}
        - name: backup-upload
          image: {{ printf "%s:%s" .Values.backup.upload.image.repository .Values.backup.upload.image.tag | quote }}
          imagePullPolicy: {{ .Values.backup.upload.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            # Azure Workload Identity: the webhook injects AZURE_CLIENT_ID,
            # AZURE_TENANT_ID, AZURE_FEDERATED_TOKEN_FILE and AZURE_AUTHORITY_HOST
            # from the pod label + annotated ServiceAccount. No secrets needed.
            # Give `az` a writable config/profile dir on the scratch emptyDir so
            # the root filesystem can stay read-only.
            - name: AZURE_CONFIG_DIR
              value: /azure
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              dest_prefix="{{ with .Values.backup.upload.prefix }}{{ . }}{{ end }}"
              while true; do
                if az login --service-principal \
                    -u "$AZURE_CLIENT_ID" \
                    -t "$AZURE_TENANT_ID" \
                    --federated-token "$(cat "$AZURE_FEDERATED_TOKEN_FILE")" \
                    --allow-no-subscriptions >/dev/null; then
                  az storage blob upload-batch \
                    --account-name {{ .Values.backup.upload.account | quote }} \
                    --destination "{{ .Values.backup.upload.container }}${dest_prefix:+/$dest_prefix}" \
                    --source /data/backups \
                    --pattern 'snapshot-*.db' \
                    --auth-mode login \
                    --overwrite false \
                    || echo "blob upload failed; retrying next tick"
                else
                  echo "az login failed; retrying next tick"
                fi
                sleep {{ .Values.backup.upload.pollSeconds }}
              done
          resources:
            {{- toYaml .Values.backup.upload.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
            - name: cli-scratch
              mountPath: /azure
        {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        {{- if .Values.backup.upload.enabled }}
        - name: cli-scratch
          emptyDir:
            sizeLimit: 128Mi
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}
