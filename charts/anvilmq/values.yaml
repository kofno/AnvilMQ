# Single-node only. Additional replicas would be independent queues, not HA.
replicaCount: 1
image:
  repository: anvilmq
  tag: "" # Defaults to Chart.appVersion; override with the release tag.
  digest: "" # If supplied, takes precedence over tag.
  pullPolicy: IfNotPresent
imagePullSecrets: []
durability: FULL
logLevel: info
# Explicit queue names for pressure metrics; global metrics always include all queues.
metricsQueues: [] # At most 32 names. Never use tenant IDs or dynamically generated queue names.
persistence:
  size: 10Gi
  storageClass: "" # Empty uses the cluster default; AKS example uses managed-csi.
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 1Gi
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
networkPolicy:
  enabled: true
  # Same-namespace callers must have this label. Override peers for cross-namespace access.
  allowedFrom:
    - podSelector:
        matchLabels:
          anvilmq-client: "true"
# Auto-provision the bundled Grafana dashboards via the Grafana dashboard sidecar
# (kube-prometheus-stack convention). Disabled by default; the JSON is always
# importable by hand from charts/anvilmq/dashboards/.
dashboards:
  enabled: false
  # Sidecar discovery label. The default matches kube-prometheus-stack's sidecar.
  label: grafana_dashboard
  value: "1"
  # Optional Grafana folder to file the dashboards under (empty = General).
  folder: ""
  # Namespace for the ConfigMap; empty uses the release namespace. The Grafana
  # sidecar must be allowed to watch this namespace.
  namespace: ""
# Optional provisioning of a Grafana Infinity datasource for the recent-failures
# table dashboard (anvilmq-failures). The dashboard reads GET /v1/failures as JSON
# through the yesoreyeram-infinity-datasource plugin. Disabled by default: it
# requires the Infinity plugin to be installed in Grafana (e.g. via
# GF_INSTALL_PLUGINS / grafana.plugins). The chart cannot install the plugin.
infinityDatasource:
  enabled: false
  # Datasource display name; also used as its provisioned uid.
  name: AnvilMQ Failures
  # Base URL for the datasource. Empty defaults to the in-cluster broker service
  # DNS and HTTP port (see charts/anvilmq/templates/service.yaml).
  url: ""
  # Datasource sidecar discovery label. The default matches kube-prometheus-stack.
  sidecarLabel: grafana_datasource
  sidecarValue: "1"
  # Namespace for the ConfigMap; empty uses the release namespace. The Grafana
  # sidecar must be allowed to watch this namespace.
  namespace: ""
