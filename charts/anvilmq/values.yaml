# Single-node only. Additional replicas would be independent queues, not HA.
replicaCount: 1
image:
  repository: anvilmq
  tag: "" # Defaults to Chart.appVersion; override with the release tag.
  digest: "" # If supplied, takes precedence over tag.
  pullPolicy: IfNotPresent
imagePullSecrets: []
durability: FULL
logLevel: info
# Explicit queue names for pressure metrics; global metrics always include all queues.
metricsQueues: [] # At most 32 names. Never use tenant IDs or dynamically generated queue names.
persistence:
  size: 10Gi
  storageClass: "" # Empty uses the cluster default; AKS example uses managed-csi.
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 1Gi
# Broker engine operational knobs. Every key is OPTIONAL: an empty string (or
# false) means "use the broker's built-in default", and the chart emits the
# matching ANVILMQ_* env var ONLY when a value is set. Defaults and range
# validation therefore stay single-sourced in the binary — the chart never
# duplicates them. A present-but-invalid value fails broker startup, so keep
# these lenient here. Numerics are strings so `| quote` works and "" is falsy.
engine:
  maxExecutionDepth: "" # ANVILMQ_MAX_EXECUTION_DEPTH — recursion breaker limit (broker default 10, min 1; always on, only retunable).
  maxChainSize: "" # ANVILMQ_MAX_CHAIN_SIZE — runaway-chain quarantine cap (broker default 0 = disabled, non-negative).
  leaseDurationMs: "" # ANVILMQ_LEASE_DURATION_MS — worker lease TTL ms (broker default 30000, min 1000).
  recoveryIntervalMs: "" # ANVILMQ_RECOVERY_INTERVAL_MS — expired-lease sweep cadence ms (broker default 5000, > 0).
  recoveryBatchSize: "" # ANVILMQ_RECOVERY_BATCH_SIZE — leases reclaimed per sweep (broker default 100, min 1).
  fairnessEnabled: false # ANVILMQ_FAIRNESS_ENABLED — equal round-robin fairness across facets (broker default false).
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
# Backups: the broker's local snapshot writer plus an optional upload sidecar.
# Everything here is OFF by default, so a default install is unchanged.
backup:
  # Enable the broker's local snapshot writer. Emits ANVILMQ_BACKUP_* env and
  # writes snapshots to /data/backups on the data PVC (shared with the sidecar).
  enabled: false
  # Snapshot cadence in milliseconds (ANVILMQ_BACKUP_INTERVAL_MS). Keep within
  # the 1–5 min recovery-point band.
  intervalMs: 120000
  # Most-recent local snapshots to keep (ANVILMQ_BACKUP_RETAIN); older ones are
  # pruned locally after each write. Remote pruning is out of band (see below).
  retain: 3
  upload:
    # Ship /data/backups to Azure Blob Storage with a poll loop that federated-
    # logs in and runs `az storage blob upload-batch`. Implies backup.enabled.
    # Authenticates via Azure Workload Identity — no secrets or connection
    # strings. Remote retention is an Azure Blob lifecycle-management rule, NOT
    # the sidecar (it never deletes remote blobs).
    enabled: false
    # Sidecar image. MUST contain the Azure CLI (`az`). The default ships it;
    # operators may swap it for a pinned/mirrored image that bundles `az`.
    image:
      repository: mcr.microsoft.com/azure-cli
      tag: "2.64.0"
      pullPolicy: IfNotPresent
    # Target storage account name (e.g. examplesa). Required when upload.enabled.
    account: ""
    # Target blob container name. Required when upload.enabled.
    container: ""
    # Optional key prefix within the container (no leading/trailing slash).
    prefix: ""
    # Poll interval for the upload loop, in seconds.
    pollSeconds: 30
    # Azure Workload Identity wiring. clientId is the user-assigned managed
    # identity's client ID; the chart annotates its ServiceAccount with it and
    # labels the pod azure.workload.identity/use: "true". Required when enabled.
    workloadIdentity:
      clientId: ""
      tenantId: ""
    # Sidecar resource requests/limits (kept small; the upload loop is I/O bound).
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
networkPolicy:
  enabled: true
  # Same-namespace callers must have this label. Override peers for cross-namespace access.
  allowedFrom:
    - podSelector:
        matchLabels:
          anvilmq-client: "true"
# Auto-provision the bundled Grafana dashboards via the Grafana dashboard sidecar
# (kube-prometheus-stack convention). Disabled by default; the JSON is always
# importable by hand from charts/anvilmq/dashboards/.
dashboards:
  enabled: false
  # Sidecar discovery label. The default matches kube-prometheus-stack's sidecar.
  label: grafana_dashboard
  value: "1"
  # Optional Grafana folder to file the dashboards under (empty = General).
  folder: ""
  # Namespace for the ConfigMap; empty uses the release namespace. The Grafana
  # sidecar must be allowed to watch this namespace.
  namespace: ""
# Optional provisioning of a Grafana Infinity datasource for the recent-failures
# table dashboard (anvilmq-failures). The dashboard reads GET /v1/failures as JSON
# through the yesoreyeram-infinity-datasource plugin. Disabled by default: it
# requires the Infinity plugin to be installed in Grafana (e.g. via
# GF_INSTALL_PLUGINS / grafana.plugins). The chart cannot install the plugin.
infinityDatasource:
  enabled: false
  # Datasource display name; also used as its provisioned uid.
  name: AnvilMQ Failures
  # Base URL for the datasource. Empty defaults to the in-cluster broker service
  # DNS and HTTP port (see charts/anvilmq/templates/service.yaml).
  url: ""
  # Datasource sidecar discovery label. The default matches kube-prometheus-stack.
  sidecarLabel: grafana_datasource
  sidecarValue: "1"
  # Namespace for the ConfigMap; empty uses the release namespace. The Grafana
  # sidecar must be allowed to watch this namespace.
  namespace: ""
