services:
  broker:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      ANVILMQ_ADDR: 0.0.0.0:50051
      ANVILMQ_HTTP_ADDR: 0.0.0.0:9090
      ANVILMQ_DB_PATH: /data/anvil.db
      RUST_LOG: info
    ports:
      - "127.0.0.1:${ANVILMQ_HARNESS_GRPC_PORT:-50061}:50051"
      - "127.0.0.1:${ANVILMQ_HARNESS_HTTP_PORT:-9091}:9090"
    volumes:
      - broker-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9090/readyz"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
  runner:
    build:
      context: ..
      dockerfile: harness/Dockerfile
    environment:
      ANVILMQ_ADDR: broker:50051
      ANVILMQ_HTTP_URL: http://broker:9090
      ANVILMQ_RESULTS_DIR: /results
    volumes:
      - ./artifacts:/results
    profiles: [tools]
volumes:
  broker-data:
